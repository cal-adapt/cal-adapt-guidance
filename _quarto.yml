bibliography: references.bib
csl: citation-style.csl
reference-section-title: "References"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    format-links: [pdf]
    citation: true
    appendix-cite-as: display
    include-after-body: glossary/_glossary-tooltip-inline.html
  pdf:
    toc: false
    citation: true
    latex-auto-install: false
    mainfont: Arial
    fontsize: 11pt
    geometry:
      - margin=1in
      - headsep=35pt
    template-partials:
      - templates/pdf/title.tex
    filters:
      - filters/pdf-citation.lua
    include-in-header:
      text: |
        \usepackage{fancyhdr}
        \usepackage{graphicx}
        \usepackage{xcolor}
        \definecolor{caladaptorange}{HTML}{F79226}
        \definecolor{caladaptorangelight}{HTML}{FBECDA}
        \usepackage[framemethod=tikz]{mdframed}
        \newmdenv[
          hidealllines=true,
          innerleftmargin=0pt, innerrightmargin=0pt,
          innertopmargin=6pt, innerbottommargin=6pt
        ]{citebox}
        \newmdenv[
          backgroundcolor=caladaptorangelight,
          linecolor=caladaptorange,
          linewidth=0.5pt,
          roundcorner=2pt,
          innerleftmargin=12pt, innerrightmargin=12pt,
          innertopmargin=10pt, innerbottommargin=10pt
        ]{titlebox}
        \graphicspath{{./assets/}{../assets/}{../../assets/}{../../../assets/}}
        \pagestyle{fancy}
        \fancyhf{}
        \fancyfoot[R]{\includegraphics[height=0.8cm]{bear.png}}
        \fancyfoot[C]{\thepage}
        \renewcommand{\headrulewidth}{0pt}
        \renewcommand{\footrulewidth}{0pt}
        \fancypagestyle{plain}{
          \fancyhf{}
          \fancyfoot[L]{\parbox[b]{0.7\linewidth}{\textcolor{caladaptorange}{\textbf{Cal-Adapt}\\Supporting California’s Energy Resilience, Reliability, and Planning}}}
          \fancyfoot[R]{\includegraphics[height=0.8cm]{bear.png}}
          \renewcommand{\headrulewidth}{0pt}
          \renewcommand{\footrulewidth}{0pt}
        }
