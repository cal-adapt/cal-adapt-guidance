name: Deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install TinyTeX
        run: quarto install tinytex --no-prompt

      - name: Install additional LaTeX packages
        run: |
          TLMGR="$(find "$HOME" -maxdepth 6 -iname tlmgr 2>/dev/null | head -n 1)"
          if [ -z "$TLMGR" ]; then
            echo "::error::could not locate tlmgr under $HOME"
            find "$HOME" -maxdepth 6
            exit 1
          fi
          "$TLMGR" update --self
          "$TLMGR" install luatexbase tcolorbox fontawesome5

      - name: Install Chrome (PDF/Mermaid rendering)
        if: github.event_name != 'pull_request'
        run: quarto install chrome-headless-shell --no-prompt

      - name: Render site
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            quarto render --to html
          else
            quarto render
          fi

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: _site
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          enable-pull-request-comment: true
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
