bibliography: references.bib
csl: citation-style.csl
reference-section-title: "References"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    format-links: [pdf]
    citation: true
    appendix-cite-as: display
    include-after-body: glossary/_glossary-tooltip-inline.html
  pdf:
    toc: false
    citation: true
    mainfont: Inter
    geometry:
      - margin=1in
    template-partials:
      - templates/title.tex
    filters:
      - filters/pdf-citation.lua
    include-in-header:
      text: |
        \usepackage{fancyhdr}
        \usepackage{graphicx}
        \usepackage{xcolor}
        \definecolor{caladaptorange}{HTML}{E8621A}
        \usepackage[framemethod=tikz]{mdframed}
        \newmdenv[
          backgroundcolor=caladaptorange!10,
          linecolor=caladaptorange,
          linewidth=0.5pt,
          roundcorner=2pt,
          innerleftmargin=8pt, innerrightmargin=8pt,
          innertopmargin=6pt, innerbottommargin=6pt
        ]{citebox}
        \graphicspath{{./assets/}{../assets/}{../../assets/}{../../../assets/}}
        \pagestyle{fancy}
        \fancyhf{}
        \fancyfoot[L]{\textcolor{caladaptorange}{cal-adapt.org}}
        \fancyfoot[R]{\includegraphics[height=0.8cm]{bear.png}}
        \fancyfoot[C]{\thepage}
        \renewcommand{\headrulewidth}{0pt}
        \renewcommand{\footrulewidth}{0pt}
        \fancypagestyle{plain}{
          \fancyhf{}
          \fancyfoot[L]{\textcolor{caladaptorange}{cal-adapt.org}}
          \fancyfoot[R]{\includegraphics[height=0.8cm]{bear.png}}
          \fancyfoot[C]{\thepage}
          \renewcommand{\headrulewidth}{0pt}
          \renewcommand{\footrulewidth}{0pt}
        }
