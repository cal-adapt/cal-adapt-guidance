name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.37

      - name: Install TinyTeX
        run: quarto install tinytex --no-prompt

      - name: Install additional LaTeX packages
        run: |
          TLMGR="$(find "$HOME" -maxdepth 6 -iname tlmgr 2>/dev/null | head -n 1)"
          if [ -z "$TLMGR" ]; then
            echo "::error::could not locate tlmgr under $HOME"
            find "$HOME" -maxdepth 6
            exit 1
          fi
          "$TLMGR" update --self
          "$TLMGR" install luatexbase tcolorbox fontawesome5

      - name: Install Arial (msttcorefonts)
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y ttf-mscorefonts-installer
          sudo fc-cache -f -v

      - name: Install Chrome (PDF/Mermaid rendering)
        run: quarto install chrome-headless-shell --no-prompt

      - name: Render site
        run: quarto render

      - name: Dump LaTeX logs on failure
        if: failure()
        run: |
          find . -name "*.log" -not -path "./_site/*" -print -exec cat {} \;

      - name: Upload generated tex on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-tex
          path: |
            scientific-guidance/climate_profiles/*.tex
            scientific-guidance/climate_profiles/*.log

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
